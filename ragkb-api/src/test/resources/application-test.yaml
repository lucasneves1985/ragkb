spring:
  datasource:
    # Banco separado do de desenvolvimento. Crie antes de rodar os testes:
    #   docker exec -it <container-postgres> psql -U postgres -c "CREATE DATABASE ragkb_test;"
    url: jdbc:postgresql://localhost:5432/ragkb_test
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # O FlywayConfig customizado executa migrate() dentro do @Bean — desligar
  # o auto-config evita migração dupla, mas o bean continua migrando.
  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  ai:
    model:
      chat: openai
      embedding: google-genai
      embedding.text: google-genai
    google:
      genai:
        embedding:
          # Chave fictícia: os testes de integração do KbLexicalSearchRepository
          # não chamam o embedding. Se um teste futuro precisar, use uma chave real.
          api-key: test-key-nao-usada
          text:
            model: gemini-embedding-001
            dimensions: 1536
    openai:
      api-key: test-key-nao-usada
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b
        temperature: 0.1
        max-tokens: 1024
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

app:
  business-rules:
    similarity-threshold: 0.70
  routing:
    enabled: false
  security:
    jwt:
      secret: test-secret-com-pelo-menos-32-bytes-para-hmac
      expiration-seconds: 3600
    admin-password: admin123
    allow-private-ips: true
  eval:
    enabled: false
    generate-dataset: false