spring:
  application:
    name: ragkb
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ragkb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate # era update — isso muda AGORA
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    model:
      chat: openai # Groq via cliente OpenAI
      embedding: google-genai # Gemini
      embedding.text: google-genai # Google GenAI text embeddings

    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 1536
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b
        temperature: 0.1
        max-tokens: 1024

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        #initialize-schema: true
  mail:
    host: ${SMTP_HOST:smtp.kinghost.net}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:teste@email}
    password: ${SMTP_PASSWORD:123}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  routing:
    enabled: true
    similarity-threshold: 0.70
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-troque-antes-de-producao-32bytes}
      expiration-seconds: 3600
    admin-password: ${ADMIN_PASSWORD:admin123}
    # true  = permite ranges privados (10/8, 172.16/12, 192.168/16) — rede corporativa
    # false = bloqueia; só IPs públicos são aceitos (default seguro)
    # SEMPRE bloqueado, independente desta flag: loopback (localhost),
    # 0.0.0.0 e link-local 169.254.0.0/16 (metadata endpoints de cloud).
    allow-private-ips: true

  eval:
    enabled: false
    generate-dataset: false
    output: src/main/resources/eval/dataset-generated.json
  ticket:
    recipient-email: ${TICKET_RECIPIENT_EMAIL:chamados@unimed303.com.br}
    from-email: ${SMTP_USERNAME:Lucas}

  waha:
    base-url: ${WAHA_URL:http://localhost:3000}
    api-key: ${WAHA_API_KEY:app_rag_api_key}
    session: ${WAHA_SESSION:default}
  integrations:
    crypto-key: ${INTEGRATION_CRYPTO_KEY:TWen2jdEgfvDjp9UkwrD89t/zhOl/vxeOSoz/8il5I8=}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
ragkb:
  media:
    path: ${RAGKB_MEDIA_PATH:/var/ragkb/media/articles}
    attachments-path: ${ATTACHMENTS_PATH:./data/attachments}
    max-size-bytes: 5242880
  articles:
    public-base-url: ${RAGKB_ARTICLES_BASE_URL:http://localhost:5173}
