spring:
  application:
    name: ragkb
  datasource:
    url: jdbc:postgresql://localhost:5432/ragkb
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    model:
      chat: openai # Groq via cliente OpenAI
      embedding: google-genai # Gemini
      embedding.text: google-genai # Google GenAI text embeddings

    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 1536
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b
        temperature: 0.1
        max-tokens: 1024

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-troque-antes-de-producao-32bytes}
      expiration-seconds: 3600
    admin-password: ${ADMIN_PASSWORD:admin123}

  eval:
    enabled: false
    generate-dataset: false
    output: src/main/resources/eval/dataset-generated.json
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
