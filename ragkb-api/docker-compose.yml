services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragkb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragkb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      
  waha:
    image: devlikeapro/waha:latest
    environment:
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: admin123
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-app_rag_api_key}
      # Engine webjs via Core (gratuito). NOWEB/GOWS são alternativas.
      WHATSAPP_DEFAULT_ENGINE: WEBJS
    ports:
      - "3000:3000"
    volumes:
      # OBRIGATÓRIO: sem este volume o QR Code é reescaneado a cada restart
      - waha-sessions:/app/.sessions
      - waha-media:/app/.media
    restart: unless-stopped

volumes:
  pgdata:
  waha-sessions:
  waha-media: