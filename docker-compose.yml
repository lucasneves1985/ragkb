services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragkb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragkb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  waha:
    image: devlikeapro/waha:latest
    environment:
      # Chave de API da própria WAHA — exporte WAHA_API_KEY no .env
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-app_rag_api_key}
      # Engine webjs via Core (gratuito). NOWEB/GOWS são alternativas.
      WHATSAPP_DEFAULT_ENGINE: WEBJS
    ports:
      - "3000:3000"
    volumes:
      # OBRIGATÓRIO: sem este volume o QR Code é reescaneado a cada restart
      - waha-sessions:/app/.sessions
      - waha-media:/app/.media
    restart: unless-stopped

  api:
    build: ./ragkb-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-antes-de-producao-32bytes}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TICKET_RECIPIENT_EMAIL: ${TICKET_RECIPIENT_EMAIL:-chamados@unimed303.com.br}
      SMTP_HOST: ${SMTP_HOST:-smtp.kinghost.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-teste@email}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-123}
      RAGKB_ARTICLES_BASE_URL: ${RAGKB_ARTICLES_BASE_URL:-http://localhost:5173}
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      INTEGRATION_CRYPTO_KEY: ${INTEGRATION_CRYPTO_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - media-data:/var/ragkb/media/articles

  ui:
    build: ./ragkb-ui
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
  media-data:
  waha-sessions:
  waha-media: